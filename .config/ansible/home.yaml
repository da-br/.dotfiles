---
- name: Add pacman packahes Arch-based system
  hosts: localhost
  become: yes
  tasks:

    - name: Install required packages
      package:
        name:
          - ripgrep
          - fd
          - stow
          - fzf
          - zoxide
          - eza
          - lazygit
          - go
          - zig
          - jetbrains-toolbox
          - wezterm
          - docker
          - neovim
          - kanshi
        state: present

- name: Configure Arch-based system
  hosts: localhost
  become: no
  tasks:

    - name: Install Brave browser extensions
      kewlfft.aur.aur:
        name: brave-bin
        use: yay
        state: present

    - name: Ensure Neovim symlinks are in place
      file:
        src: "{{ ansible_env.HOME }}/.dotfiles/.config/nvim"
        dest: "{{ ansible_env.HOME }}/.config/nvim"
        state: link

    - name: Configure Git user settings
      git_config:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        scope: global
      loop:
        - { name: "user.name", value: "Daniel Brandenburg" }
        - { name: "user.email", value: "brandendj@gmail.com" }
        - { name: "core.autocrlf", value: "false" }

    - name: Create symlinks for dotfiles
      file:
        src: "{{ ansible_env.HOME }}/.dotfiles/{{ item }}"
        dest: "{{ ansible_env.HOME }}/{{ item }}"
        state: link
      loop:
        - .wezterm.lua
        - .ideavimrc
        # - .zshrc

    - name: Set MIME application defaults
      copy:
        dest: "{{ ansible_env.HOME }}/.config/mimeapps.list"
        content: |
          [Default Applications]
          text/html=brave-browser.desktop
          x-scheme-handler/http=brave-browser.desktop
          x-scheme-handler/https=brave-browser.desktop
          x-scheme-handler/terminal=org.wezfurlong.wezterm.desktop

    - name: Ensure Kanshi profiles exist
      copy:
        dest: "{{ ansible_env.HOME }}/.config/kanshi/config"
        content: |
          profile docked {
            output DP-2 enable position 0,0
            output eDP-1 disable
          }
          profile undocked {
            output eDP-1 enable position 0,0
          }

    - name: Ensure systemd user directory exists
      file:
        path: "{{ ansible_env.HOME }}/.config/systemd/user"
        state: directory
        mode: '0755'

    - name: Ensure Kanshi service file exists
      copy:
        dest: "{{ ansible_env.HOME }}/.config/systemd/user/kanshi.service"
        content: |
          [Unit]
          Description=Kanshi dynamic display configuration
          Documentation=https://wayland.emersion.fr/kanshi/
          PartOf=graphical-session.target

          [Service]
          Type=simple
          ExecStart=/usr/bin/kanshi
          Restart=always

          [Install]
          WantedBy=graphical-session.target
        mode: '0644'
    
    - name: Ensure Kanshi service is enabled
      systemd:
        name: kanshi
        enabled: yes
        state: started
        scope: user
        daemon_reload: yes

