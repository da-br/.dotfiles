[colors]
background = #1E1E2E
foreground = #CDD6F4
primary = #89B4FA
secondary = #F5C2E7
alert = #F38BA8

[bar/top]
width = 100%
height = 25
radius = 6
fixed-center = false
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 3
line-color = #f00
border-size = 4
border-color = #00000000
padding-left = 0
padding-right = 2
module-margin-left = 1
module-margin-right = 2
font-0 = "Noto Sans Mono:style=Regular;0"
font-1 = "Noto Color Emoji:style=Regular:scale=9;1"
offset-x = 0
offset-y = 0

modules-left = i3
modules-right = pulseaudio wlan eth ram cpu battery date

tray-position = right
tray-padding = 2
cursor-click = pointer
cursor-scroll = ns-resize

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
label-mode-padding = 2
label-mode-foreground = #000
label-mode-background = ${colors.primary}
label-focused = %index%
label-focused-background = ${colors.primary}
label-focused-padding = 2
label-unfocused = %index%
label-unfocused-padding = 2
label-visible = %index%
label-visible-background = ${self.label-focused-background}
label-visible-padding = ${self.label-focused-padding}
label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3.0
label-connected = 📡:d:%downspeed%  u:%upspeed%
format-connected = <label-connected>
format-disconnected = 
ramp-signal-foreground = ${colors.foreground}

[module/eth]
type = internal/network
interface = enx9cebe8bf8f1c
interval = 3.0
format-connected-prefix = "⛓️: "
format-disconnected =
label-connected = %linkspeed%
format-connected-prefix-foreground = ${colors.foreground}

[module/date]
type = internal/date
interval = 5
date = "%Y-%m-%d"
time = %H:%M
format-prefix = "🕰️:"
format-prefix-foreground = ${colors.foreground}
label = %date% %time%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume> <bar-volume>
label-volume = "🎷:%percentage%%"
label-volume-foreground = ${root.foreground}
label-muted = 🔇:muted
label-muted-foreground = #666
bar-volume-width = 10
bar-volume-foreground-0 = #55aa55
bar-volume-foreground-1 = #55aa55
bar-volume-foreground-2 = #55aa55
bar-volume-foreground-3 = #55aa55
bar-volume-foreground-4 = #55aa55
bar-volume-foreground-5 = #f5a70a
bar-volume-foreground-6 = #ff5555
bar-volume-gradient = false
bar-volume-indicator = |
bar-volume-indicator-font = 2
bar-volume-fill = ─
bar-volume-fill-font = 2
bar-volume-empty = ─
bar-volume-empty-font = 2
bar-volume-empty-foreground = ${colors.foreground}
click-right = pavucontrol

[module/battery]
type = internal/battery
battery = BAT1
adapter = ACAD
full-at = 98
format-charging = <label-charging>
format-discharging = <label-discharging>
format-full-prefix = " "
format-full-prefix-foreground = ${colors.foreground}
label-full = 🔋
label-charging = "⚡%percentage%%"
label-discharging ="🔌%percentage%%"
animation-charging-foreground = ${colors.foreground}
animation-charging-framerate = 750
animation-discharging-foreground = ${colors.foreground}
animation-discharging-framerate = 750

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "🪨: "
format-prefix-foreground = ${colors.foreground}
label = %percentage%%
label-foreground = ${colors.foreground}

[module/ram]
type = internal/memory
interval = 2
format-prefix = "📭: "
format-prefix-foreground = ${colors.foreground}
label = %used%/%total%
label-foreground = ${colors.foreground}

[settings]
screenchange-reload = true

[global/wm]
margin-top = 5
margin-bottom = 5
